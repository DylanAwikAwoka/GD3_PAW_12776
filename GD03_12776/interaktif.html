<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="judulHalaman">Halaman Interaktif Saya</h1>
    <a href="profil.html" onclick="return confirm('Apakah Anda yakin ingin berpindah halaman?');">Kembali ke Profil</a>
    <a href="form.html" onclick="return confirm('Apakah Anda yakin ingin berpindah halaman?');">Ke Halaman Form</a>

    <h2>Dialog Box</h2>
    <input type="text" id="inputNama" placeholder="Nama kamu">
    <button onclick="tampilkanNama()">Tampilkan</button>

    <input type="number" id="inputAngka" placeholder="Kuardratkan angka">
    <button onclick="kuadratkanAngka()">Kuadratkan</button>
    <p id="hasilKuadrat"></p>

    <script>
        const judul = document.getElementById("judulHalaman");
        judul.style.color = "red";
        console.log(judul.innerHTML);
        
        function sapa(nama) {
            return "Halo, " + nama + "!";
        }
        console.log(sapa("Dylan"));

        function ubahBiru() {
            document.getElementById("teks").style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;

            if (nama === "") {
                alert("Silakan isi nama dulu.");
            } else {
                alert("Halo, " + nama + "!");
            }
        }

        function kuadratkanAngka() {
            const angka = document.getElementById("inputAngka").value;
            const hasil = angka * angka;
            document.getElementById("hasilKuadrat").innerText = "Hasil kuadrat: " + hasil;
        }

    </script>
    <h2>Ubah Warna Teks</h2>
    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>
</body>
</html>
